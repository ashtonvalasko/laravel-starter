services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
        WWWUSER: ${WWWUSER:-1000}
    image: laravel-starter:local
    container_name: laravel-starter-app
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      MAIL_MAILER: ${MAIL_MAILER:-log}
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    command: ["/var/www/html/docker/entrypoint.sh"]

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
        WWWUSER: ${WWWUSER:-1000}
    image: laravel-starter:local
    container_name: laravel-starter-vite
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
    command: ["/bin/sh", "-c", "npm install && npm run dev -- --host=0.0.0.0 --port=5173"]

  mysql:
    image: mysql:8.4
    container_name: laravel-starter-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_starter}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: laravel-starter-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

volumes:
  mysql-data:
    driver: local
